name: Supabase keepalive

on:
  schedule:
    # Every 3 days. Well under Supabase's 7-day free-tier pause threshold, with
    # margin for a run getting delayed or skipped without ever crossing the line.
    - cron: "0 6 */3 * *"
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab to test

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Hit the keepalive endpoint
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" https://qff-2026-site.vercel.app/api/keepalive)
          echo "Response status: $status"
          if [ "$status" != "200" ]; then
            echo "::error::Keepalive endpoint returned $status, not 200"
            exit 1
          fi
